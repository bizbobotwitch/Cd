<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotify Playlist → MP3Juice Links</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    input { width: 100%; padding: 0.75rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; background: #1db954; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .song-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    .song-item a { color: #1db954; text-decoration: none; font-weight: 600; }
    .warning { background: #fff3cd; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Spotify Playlist → MP3Juice Links</h1>
  <div class="warning">
    ⚠️ This only generates search links. It does not download files automatically. Only download music you own or have permission to use.
  </div>

  <input id="playlistUrl" placeholder="https://open.spotify.com/playlist/..." />
  <button onclick="loadPlaylist()">Load Playlist</button>
  <div id="results"></div>

  <script>
    async function loadPlaylist() {
      const url = document.getElementById('playlistUrl').value.trim();
      const results = document.getElementById('results');
      results.innerHTML = 'Loading...';

      const res = await fetch(`/api/playlist?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      if (data.error) {
        results.innerHTML = `<p>Error: ${data.error}</p>`;
        return;
      }

      results.innerHTML = '';
      data.tracks.forEach((track, i) => {
        const query = encodeURIComponent(`${track.artists} - ${track.name}`);
        const mp3Url = `https://mp3juice.sc/search?q=${query}`;
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
          <span>${i + 1}.</span>
          <span>${track.artists} - ${track.name}</span>
          <a href="${mp3Url}" target="_blank" rel="noopener">Open on MP3Juice</a>
        `;
        results.appendChild(div);
      });
    }
  </script>
</body>
</html>
