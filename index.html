<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Download Helper</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 150px; padding: 0.75rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
        button { margin-top: 1rem; padding: 0.75rem 1.5rem; font-size: 1rem; background: #1db954; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #1ed760; }
        .song-list { margin-top: 1.5rem; }
        .song-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
        .song-item a { color: #1db954; text-decoration: none; font-weight: 600; }
        .song-item a:hover { text-decoration: underline; }
        .note { background: #fff3cd; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Playlist → MP3Juice Helper</h1>
    <div class="note">
        ⚠️ <strong>Note:</strong> This tool does not download files automatically. It opens MP3Juice for each song so you can download them manually. Only download content you own or have permission to use.
    </div>

    <p>Paste your song list below (one song per line, e.g., "Artist - Title").</p>
    <textarea id="songInput" placeholder="Example:
The Weeknd - Blinding Lights
Dua Lipa - Levitating
Ed Sheeran - Shape of You"></textarea>
    <button onclick="generateLinks()">Open MP3Juice for Each Song</button>

    <div id="results" class="song-list"></div>

    <script>
        function generateLinks() {
            const input = document.getElementById('songInput').value.trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (!input) {
                resultsDiv.innerHTML = '<p>Please paste at least one song.</p>';
                return;
            }

            const songs = input.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            songs.forEach((song, index) => {
                const query = encodeURIComponent(song);
                const url = `https://mp3juice.sc/search?q=${query}`;

                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <span>${index + 1}.</span>
                    <span>${song}</span>
                    <a href="${url}" target="_blank" rel="noopener">Open on MP3Juice</a>
                `;
                resultsDiv.appendChild(item);
            });
        }
    </script>
</body>
</html>
